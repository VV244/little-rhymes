name: Django and frontend checks
on:
  push:
    branches: [main, little-rhymes-3d]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: 'True'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/little_rhymes_test
      DATABASE_SSL_REQUIRE: 'False'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: little_rhymes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput
      - name: Ensure compiled assets match checked-in source
        run: git diff --exit-code -- static/dist
